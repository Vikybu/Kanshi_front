name: configCi
on: 
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 20
              cache: npm
          - run: rm -rf node_modules package-lock.json
          - name: Install dependencies
            run: npm install
          - name: Vérification TypeScript
            run: npm run build --if-present
          - name: Running Tests 
            run: npm test